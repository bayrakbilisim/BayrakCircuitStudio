name: Windows Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BayrakCircuitStudio.csproj
      - name: Build Release
        run: dotnet build BayrakCircuitStudio.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish BayrakCircuitStudio.csproj -c Release --no-build -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: BayrakCircuitStudio-Windows
          path: publish/
